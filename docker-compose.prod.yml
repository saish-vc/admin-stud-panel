name: nttf-certificate-portal

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: '4000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  WEB_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  PUBLIC_APP_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  ENABLE_DOCS: 'false'
  BCRYPT_COST: '12'
  RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-5}
  RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-1}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nttf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nttf_portal}
    volumes:
      - nttf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nttf} -d ${POSTGRES_DB:-nttf_portal}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: nttf-portal-api:${IMAGE_TAG:-latest}
    command: ['node', 'apps/api/dist/migrate.js']
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: nttf-portal-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - nttf_storage:/data/storage
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/liveness').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: nttf-portal-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

  # Optional demo/initial provisioning. Run explicitly with --profile seed.
  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: nttf-portal-api:${IMAGE_TAG:-latest}
    command: ['node', 'apps/api/dist/seed.js']
    environment:
      <<: *api-environment
      ALLOW_PRODUCTION_SEED: 'true'
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_STUDENT_COUNT: ${SEED_STUDENT_COUNT:-1000}
      SEED_FORCE_PASSWORD_CHANGE: ${SEED_FORCE_PASSWORD_CHANGE:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

volumes:
  nttf_pgdata:
  nttf_storage:
