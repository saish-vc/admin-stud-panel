name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: test
  DATABASE_URL: postgresql://nttf:nttf_ci_password@127.0.0.1:5432/nttf_portal_test
  TEST_DATABASE_URL: postgresql://nttf:nttf_ci_password@127.0.0.1:5432/nttf_portal_test
  BCRYPT_COST: '10'
  RATE_LIMIT_AUTH_MAX: '1000'
  RATE_LIMIT_WINDOW_MINUTES: '1'
  LOG_LEVEL: warn
  STORAGE_DRIVER: local
  PUBLIC_APP_URL: http://127.0.0.1:5173
  WEB_ORIGIN: http://127.0.0.1:5173

jobs:
  quality:
    name: Lint, types, build, coverage, docs gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nttf
          POSTGRES_PASSWORD: nttf_ci_password
          POSTGRES_DB: nttf_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nttf -d nttf_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and formatting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build web and API bundles
        run: npm run build

      - name: Unit, integration, security, and coverage gates
        run: npm run test:coverage

      - name: Verify required documentation and security sign-off
        run: |
          set -euo pipefail
          for file in \
            README.md \
            docs/SPEC.md \
            docs/ARCHITECTURE.md \
            docs/API.md \
            docs/openapi.yaml \
            docs/SECURITY.md \
            docs/RUNBOOK.md \
            docs/architecture-diagram.html \
            docs/adr/README.md; do
            test -s "$file" || { echo "Missing or empty required document: $file"; exit 1; }
          done
          grep -q 'ADR-001' docs/adr/README.md \
            || { echo 'Architecture decision records are missing'; exit 1; }
          grep -q 'OWASP API Security Top 10' docs/SECURITY.md
          grep -q 'Sign-off:' docs/SECURITY.md
          echo 'Documentation and security sign-off gates passed.'

      - name: Dependency audit (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright E2E and axe accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nttf
          POSTGRES_PASSWORD: nttf_ci_password
          POSTGRES_DB: nttf_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nttf -d nttf_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate ephemeral CI secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E journey and axe checks
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Production container images
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: nttf_ci_password
      DATABASE_URL: postgresql://nttf:nttf_ci_password@db:5432/nttf_portal
      JWT_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210fedcba9876543210
      PUBLIC_ORIGIN: https://portal.example.org
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f deploy/api.Dockerfile -t nttf-portal-api:ci .

      - name: Build web image
        run: docker build -f deploy/web.Dockerfile -t nttf-portal-web:ci .

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml config > /dev/null

  performance:
    name: k6 load profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nttf
          POSTGRES_PASSWORD: nttf_ci_password
          POSTGRES_DB: nttf_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nttf -d nttf_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PORT: '4000'
      STORAGE_LOCAL_DIR: ./storage-perf
      PUBLIC_APP_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate ephemeral CI secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Migrate and seed the performance database
        run: npm run prepare:e2e

      - name: Build API
        run: npm run build -w @nttf/api

      - name: Start API and wait for liveness
        run: |
          set -euo pipefail
          nohup node apps/api/dist/server.js > api.log 2>&1 &
          echo $! > api.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/health/liveness > /dev/null; then
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo 'API did not become ready'
          cat api.log
          exit 1

      - name: Run k6 profile (P95 < 500 ms, error rate < 1%)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e BASE_URL=http://127.0.0.1:4000 \
            -e K6_DURATION=30s \
            -e STUDENT_VUS=50 \
            -e ADMIN_VUS=10 \
            -e STUDENT_ROLL=NTTF2026001 \
            -e STUDENT_PASSWORD=Student@E2E2026 \
            -e ADMIN_EMAIL=clerk@nttf.ac.in \
            -e ADMIN_PASSWORD="${E2E_ADMIN_PASSWORD}" \
            -v "$PWD:/work" -w /work \
            grafana/k6:0.57.0 run \
            --summary-export=/work/perf-summary.json \
            e2e/performance/load-test.js

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi

      - name: Upload k6 summary and API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            perf-summary.json
            api.log
          if-no-files-found: ignore
          retention-days: 14
